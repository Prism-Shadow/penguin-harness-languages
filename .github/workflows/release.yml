# Release: cut a GitHub release for one language plugin.
#
# Tag the release as `<package>/<version>`, e.g. `language-csharp/v0.0.1`, and the workflow
# builds that package, packs it with `npm pack` and attaches the tarball to a GitHub release
# named after the tag. Publishing to npm comes later: the package names do not exist on the
# registry yet, so a maintainer publishes the first version by hand and configures Trusted
# Publishing (this repository and a release workflow) on npm; after that a publish step
# joins here, keyed off the same tag.
name: release

on:
  push:
    tags:
      - "language-*/v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Read the tag
        id: tag
        run: |
          echo "package=${GITHUB_REF_NAME%%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#*/v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the manifest
        run: |
          pkg="plugins/${{ steps.tag.outputs.package }}"
          version="${{ steps.tag.outputs.version }}"
          declared=$(node -p "require('./' + process.argv[1] + '/package.json').version" "$pkg")
          if [ "$declared" != "$version" ]; then
            echo "tag says $version but $pkg/package.json says $declared" >&2
            exit 1
          fi

      - name: Build
        run: pnpm --filter "./plugins/${{ steps.tag.outputs.package }}" build

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: plugins/${{ steps.tag.outputs.package }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          tarball=$(ls "$RUNNER_TEMP"/*.tgz)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.tag.outputs.package }} v$VERSION" \
            --notes "First release. See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)." \
            "$tarball"
