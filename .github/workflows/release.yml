# Release: cut one GitHub release for the whole repository.
#
# Tag the release as `v<version>`, e.g. `v0.0.2`, and the workflow builds every package at
# that version, packs each with `npm pack`, and attaches all tarballs to one GitHub release
# named after the tag, with the matching CHANGELOG section as the notes. Publishing to npm
# comes later: the package names do not exist on the registry yet, so a maintainer publishes
# the first version by hand and configures Trusted Publishing on npm; after that a publish
# step joins here, keyed off the same tag.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Read the version from the tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check every manifest carries the tag's version
        run: |
          version="${{ steps.tag.outputs.version }}"
          for manifest in plugins/*/package.json; do
            declared=$(node -p "require('./' + process.argv[1]).version" "$manifest")
            if [ "$declared" != "$version" ]; then
              echo "$manifest says $declared, tag says $version" >&2
              exit 1
            fi
          done

      - name: Build
        run: pnpm -r build

      - name: Pack every package
        run: pnpm -r exec npm pack --pack-destination "$RUNNER_TEMP"

      - name: One GitHub release with the changelog and every tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/*.tgz
